# docker-compose.yml
# Run the whole app locally with one command:
#   docker compose up --build
# Frontend: http://localhost:3001   Backend API: http://localhost:8000/docs

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    container_name: my-cicd-app
    ports:
      - "3001:80"      # Nginx (frontend + /api proxy)
      - "8000:8000"    # FastAPI directly
    restart: unless-stopped
    environment:
      - APP_ENV=production
