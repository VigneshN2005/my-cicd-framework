# ─────────────────────────────────────────────────
# core.yml: the CI/CD pipeline
#
#   config ─┬─ lint ── test ─┬─ docker ── deploy ── summary
#           └─ security ─────┘   (build, smoke test, Trivy, publish)
#
# Every stage reads its on/off switch and settings from
# pipeline-config.yml (parsed and validated by scripts/read_config.py).
# Any failure stops everything after it: nothing is published or
# deployed unless lint, tests, coverage and security scans all pass.
# ─────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two pipelines for the same branch at once (avoids racing deploys)
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ════════════════════════════════════════════════
  # 1. CONFIG: read and validate pipeline-config.yml
  # ════════════════════════════════════════════════
  config:
    name: Read config
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.cfg.outputs.frontend }}
      backend: ${{ steps.cfg.outputs.backend }}
      lint: ${{ steps.cfg.outputs.lint }}
      test: ${{ steps.cfg.outputs.test }}
      security: ${{ steps.cfg.outputs.security }}
      docker: ${{ steps.cfg.outputs.docker }}
      publish: ${{ steps.cfg.outputs.publish }}
      deploy: ${{ steps.cfg.outputs.deploy }}
      node_version: ${{ steps.cfg.outputs.node_version }}
      python_version: ${{ steps.cfg.outputs.python_version }}
      backend_coverage_min: ${{ steps.cfg.outputs.backend_coverage_min }}
      frontend_coverage_min: ${{ steps.cfg.outputs.frontend_coverage_min }}
      fail_on: ${{ steps.cfg.outputs.fail_on }}
      dependency_audit: ${{ steps.cfg.outputs.dependency_audit }}
      secret_scan: ${{ steps.cfg.outputs.secret_scan }}
      image_scan: ${{ steps.cfg.outputs.image_scan }}
      trivy_severity: ${{ steps.cfg.outputs.trivy_severity }}
      image_name: ${{ steps.cfg.outputs.image_name }}
      health_path: ${{ steps.cfg.outputs.health_path }}
      health_timeout_seconds: ${{ steps.cfg.outputs.health_timeout_seconds }}
      rollback_on_failure: ${{ steps.cfg.outputs.rollback_on_failure }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate pipeline-config.yml
        id: cfg
        run: python scripts/read_config.py pipeline-config.yml

  # ════════════════════════════════════════════════
  # 2. LINT: ruff (Python) and ESLint (React)
  # ════════════════════════════════════════════════
  lint:
    name: Lint
    needs: config
    if: needs.config.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: needs.config.outputs.backend == 'true'
        with:
          python-version: ${{ needs.config.outputs.python_version }}
      - name: ruff (backend + pipeline scripts)
        if: needs.config.outputs.backend == 'true'
        run: |
          pip install ruff
          ruff check . --output-format=github

      - uses: actions/setup-node@v5
        if: needs.config.outputs.frontend == 'true'
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint (frontend)
        if: needs.config.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  # ════════════════════════════════════════════════
  # 3. TEST: unit tests with coverage gates
  # ════════════════════════════════════════════════
  test:
    name: Test + coverage gate
    needs: [config, lint]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.test == 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.config.outputs.python_version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt pyyaml

      - name: Backend tests (pytest, coverage >= ${{ needs.config.outputs.backend_coverage_min }}%)
        if: needs.config.outputs.backend == 'true'
        working-directory: backend
        run: |
          pytest tests -v \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=${{ needs.config.outputs.backend_coverage_min }}

      - name: Pipeline script tests (config parser, deploy + rollback, AI review)
        run: pytest scripts/tests -v

      - uses: actions/setup-node@v5
        if: needs.config.outputs.frontend == 'true'
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests (Vitest, coverage >= ${{ needs.config.outputs.frontend_coverage_min }}%)
        if: needs.config.outputs.frontend == 'true'
        working-directory: frontend
        env:
          FRONTEND_COVERAGE_MIN: ${{ needs.config.outputs.frontend_coverage_min }}
        run: |
          npm ci
          npm run test:coverage

  # ════════════════════════════════════════════════
  # 4. SECURITY: dependency audits + secret scanning
  #    (runs in parallel with lint and test)
  # ════════════════════════════════════════════════
  security:
    name: Security scan
    needs: config
    if: needs.config.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Gitleaks scans the whole history, not just the latest commit

      - name: Secret scan (Gitleaks)
        if: needs.config.outputs.secret_scan == 'true'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        if: needs.config.outputs.dependency_audit == 'true' && needs.config.outputs.backend == 'true'
        with:
          python-version: ${{ needs.config.outputs.python_version }}
      - name: Python dependency audit (pip-audit)
        if: needs.config.outputs.dependency_audit == 'true' && needs.config.outputs.backend == 'true'
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

      - uses: actions/setup-node@v5
        if: needs.config.outputs.dependency_audit == 'true' && needs.config.outputs.frontend == 'true'
        with:
          node-version: ${{ needs.config.outputs.node_version }}
      - name: npm dependency audit (fails on ${{ needs.config.outputs.fail_on }} or worse)
        if: needs.config.outputs.dependency_audit == 'true' && needs.config.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=${{ needs.config.outputs.fail_on }}

  # ════════════════════════════════════════════════
  # 5. DOCKER: build, smoke test, image scan, publish
  # ════════════════════════════════════════════════
  docker:
    name: Docker build, scan + publish
    needs: [config, test, security]
    if: >-
      always() && needs.config.result == 'success' &&
      needs.config.outputs.docker == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GitHub Container Registry
    outputs:
      image: ${{ steps.meta.outputs.image }}
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ needs.config.outputs.image_name }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t ${{ steps.meta.outputs.image }}:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:80 ${{ steps.meta.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"version":"${{ github.sha }}"' health.json || { echo "::error::Container did not report the expected version"; docker logs smoke; exit 1; }
          curl -fs http://localhost:8080/ | grep -qi '<div id="root">' || { echo "::error::Frontend page not served"; exit 1; }
          echo "Backend and frontend both respond inside the container."
          docker rm -f smoke

      - name: Image scan (Trivy, fails on ${{ needs.config.outputs.trivy_severity }})
        if: needs.config.outputs.security == 'true' && needs.config.outputs.image_scan == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: ${{ needs.config.outputs.trivy_severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GitHub Container Registry
        if: needs.config.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image (:${{ steps.meta.outputs.short_sha }}, :${{ github.sha }}, :latest)
        id: publish
        if: needs.config.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          img=${{ steps.meta.outputs.image }}
          docker tag $img:${{ github.sha }} $img:${{ steps.meta.outputs.short_sha }}
          docker tag $img:${{ github.sha }} $img:latest
          docker push $img:${{ github.sha }}
          docker push $img:${{ steps.meta.outputs.short_sha }}
          docker push $img:latest

  # ════════════════════════════════════════════════
  # 6. DEPLOY: release to the cloud, verify, roll back on failure
  # ════════════════════════════════════════════════
  deploy:
    name: Deploy + health check
    needs: [config, docker]
    if: >-
      always() && needs.docker.result == 'success' &&
      needs.docker.outputs.published == 'true' &&
      needs.config.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write   # needed to move the :stable tag
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment secrets
        id: secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_APP_URL" ]; then
            echo "::notice title=Deploy skipped::Add RENDER_API_KEY, RENDER_SERVICE_ID and RENDER_APP_URL repository secrets to enable cloud deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Deploy to Render (rollback on failure = ${{ needs.config.outputs.rollback_on_failure }})
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          APP_URL: ${{ secrets.RENDER_APP_URL }}
          NEW_IMAGE: ${{ needs.docker.outputs.image }}:${{ github.sha }}
          STABLE_IMAGE: ${{ needs.docker.outputs.image }}:stable
          EXPECTED_VERSION: ${{ github.sha }}
          HEALTH_PATH: ${{ needs.config.outputs.health_path }}
          HEALTH_TIMEOUT: ${{ needs.config.outputs.health_timeout_seconds }}
          ROLLBACK: ${{ needs.config.outputs.rollback_on_failure }}
        run: python scripts/deploy_render.py

      - name: Log in to GitHub Container Registry
        if: steps.deploy.outputs.result == 'deployed'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote this version to :stable
        if: steps.deploy.outputs.result == 'deployed'
        run: |
          docker buildx imagetools create \
            -t ${{ needs.docker.outputs.image }}:stable \
            ${{ needs.docker.outputs.image }}:${{ github.sha }}
          echo "${{ github.sha }} is now the stable version (rollback target)."

  # ════════════════════════════════════════════════
  # 7. SUMMARY: one table of every stage's result
  # ════════════════════════════════════════════════
  summary:
    name: Pipeline summary
    needs: [config, lint, test, security, docker, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI/CD pipeline result"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Config | ${{ needs.config.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Test + coverage | ${{ needs.test.result }} |"
            echo "| Security scan | ${{ needs.security.result }} |"
            echo "| Docker build, scan + publish | ${{ needs.docker.result }} |"
            echo "| Deploy + health check | ${{ needs.deploy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
