# Linting rules for all Python code (backend + pipeline scripts)
target-version = "py311"
line-length = 120
src = ["backend", "scripts"]

[lint]
# E/W: style errors, F: real bugs (unused names, undefined names),
# B: likely bugs, S: security issues (bandit rules), I: import order
select = ["E", "W", "F", "B", "S", "I"]

[lint.per-file-ignores]
# assert is how pytest works, and tests use fake tokens; neither is a security problem
"**/tests/**" = ["S101", "S105", "S106"]
# The deploy and review scripts call fixed HTTPS APIs on purpose
"scripts/*.py" = ["S310"]
