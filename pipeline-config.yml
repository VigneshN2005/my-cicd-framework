# ─────────────────────────────────────────────────
# pipeline-config.yml
# THE CONTROL PANEL FOR THE WHOLE PIPELINE
#
# Every stage in .github/workflows/core.yml reads its
# settings from this file (via scripts/read_config.py).
#   true  = the stage runs
#   false = the stage is skipped
#
# The config is validated on every run: a typo or a
# wrong value fails the pipeline immediately with a
# clear error, instead of silently doing the wrong thing.
# ─────────────────────────────────────────────────

project:
  name: "my-cicd-framework"
  version: "2.0.0"
  # fullstack | frontend | backend
  type: "fullstack"

# ── Stages ────────────────────────────────────────
stages:
  lint: true        # ruff (Python) + ESLint (React)
  test: true        # pytest + Vitest, with coverage gates
  security: true    # dependency audit, secret scan, image scan
  docker: true      # build the image and smoke-test the container
  publish: true     # push the image to GitHub Container Registry
  deploy: true      # deploy to the cloud, health-check, roll back on failure
  ai_review: true   # LLM review comment on every pull request

# ── Tool versions ─────────────────────────────────
environment:
  node_version: "22"
  python_version: "3.11"

# ── Testing ───────────────────────────────────────
testing:
  # The pipeline fails if line coverage drops below these numbers.
  backend_coverage_min: 80
  frontend_coverage_min: 70

# ── Security (DevSecOps) ──────────────────────────
security:
  # Lowest severity that blocks a release: low | moderate | high | critical
  fail_on: "critical"
  dependency_audit: true   # pip-audit + npm audit
  secret_scan: true        # Gitleaks over the full git history
  image_scan: true         # Trivy scan of the built Docker image

# ── Container image ───────────────────────────────
docker:
  image_name: "my-cicd-app"
  # Images are tagged with the commit SHA (e.g. :3f2a9c1) and :latest.
  # :stable always points to the last version that passed its health check.

# ── Deployment ────────────────────────────────────
deploy:
  # vercel: blue-green release. The new version is built and health-checked
  #         BEFORE the production domain is switched to it.
  # render: runs the published Docker image from GHCR.
  provider: "vercel"
  # Path the health check calls. It must return the deployed commit SHA,
  # so the check proves the NEW version is the one serving.
  health_path: "/api/health"
  health_timeout_seconds: 300
  # If production fails its check after the switch, put the previous
  # version back automatically.
  rollback_on_failure: true

# ── AI code review ────────────────────────────────
ai_review:
  # groq (default, fast, free tier) | gemini
  # The matching secret must exist: GROQ_API_KEY or GEMINI_API_KEY.
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  # Large diffs are trimmed to this many characters before review.
  max_diff_chars: 60000
